# Site settings
# Changes to this file are only picked up when the site is rebuilt.

locale: en-US
title: Jacqueline Trang
title_separator: "|"
subtitle: "Data & Business Intelligence Analyst"
name: Jacqueline Trang
email: jacqueline.trang@edu.em-lyon.com
description: >-
  Portfolio of Jacqueline Trang – Business Intelligence & Data Analytics.
  Power BI dashboards, SQL (Snowflake), cohort and marketing performance analysis.
url: "https://jajatrg.github.io"
baseurl: ""   # keep empty once the repository is named jajatrg.github.io
repository: "jajatrg/jajatrg.github.io"
github_username: jajatrg

remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: air
search: true
breadcrumbs: false
words_per_minute: 200

markdown: kramdown
timezone: Europe/Paris

include:
  - _pages

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "Jacqueline Trang"
  avatar: "/assets/images/moi.jpg"
  bio: "Business Intelligence & Data Analytics · Power BI · SQL · Excel · R"
  location: "Paris / Lyon, France"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:jacqueline.trang@edu.em-lyon.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jacqueline-trang-bb4aab2b0"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jajatrg"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jacqueline-trang-bb4aab2b0"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jajatrg"

# Projects are stored in the _projects folder (one file per project)
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true
      share: false
      toc: true
      toc_label: "On this page"
      toc_sticky: true

atom_feed:
  hide: true
